<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- KOREVA Brand Red Gradient Background -->
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd0000" />
      <stop offset="50%" stop-color="#a80000" />
      <stop offset="100%" stop-color="#5e0000" />
    </linearGradient>
    
    <!-- Subtle Inner Shadow for Depth -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#brandRedGrad)" />
  
  <!-- Subtle Outer Rim Accent -->
  <rect x="10" y="10" width="492" height="492" rx="94" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" />

  <!-- K9 Monogram Group -->
  <g filter="url(#iconShadow)">
    <!-- Distinct Letter 'K' (White) -->
    <g fill="#FFFFFF">
      <!-- Vertical Stem -->
      <rect x="74" y="106" width="54" height="300" rx="8" />
      <!-- Upper Diagonal Arm -->
      <path d="M 128 258 L 230 106 H 294 L 176 284 Z" />
      <!-- Lower Diagonal Arm -->
      <path d="M 160 262 L 280 406 H 218 L 128 296 Z" />
    </g>

    <!-- Distinct Numeral '9' (Pure White with Crisp Negative Space) -->
    <path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd" d="
      M 374 106
      C 421.5 106 460 144.5 460 192
      L 460 320
      C 460 367.5 421.5 406 374 406
      C 338.5 406 308.2 384.6 295.1 353.8
      L 347.0 332.3
      C 352.6 344.8 362.4 352 374 352
      C 391.67 352 406 337.67 406 320
      L 406 259.2
      C 396.1 269.4 385.3 275.5 374 275.5
      C 326.5 275.5 288 237.0 288 189.5
      C 288 142.0 326.5 106 374 106
      Z
      M 374 158
      C 356.33 158 342 172.33 342 190
      C 342 207.67 356.33 222 374 222
      C 391.67 222 406 207.67 406 190
      C 406 172.33 391.67 158 374 158
      Z
    " />
  </g>
</svg>
